spring:
  application:
    name: smarthome-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarthome}
    username: ${DB_USER:smarthome}
    password: ${DB_PASSWORD:smarthome}
  security:
    user:
      # Temporary single admin until real users exist
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin}
  mvc:
    # Errors as RFC 9457 problem details, including the reason (e.g. why a command was refused)
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

smarthome:
  mqtt:
    url: ${MQTT_URL:tcp://localhost:1883}
    username: ${MQTT_USER:}
    password: ${MQTT_PASSWORD:}
    client-id: smarthome-backend
    z2m-base-topic: zigbee2mqtt

management:
  endpoints:
    web:
      exposure:
        include: health,info
