spring:
  application:
    name: smarthome-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarthome}
    username: ${DB_USER:smarthome}
    password: ${DB_PASSWORD:smarthome}
  mvc:
    # Errors as RFC 9457 problem details, including the reason (e.g. why a command was refused)
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

smarthome:
  auth:
    # Public keys of the Kratos tokenizer; the default fits a checkout next to homeserver-infra
    jwk-set-uri: ${AUTH_JWKS:file:../homeserver-infra/auth/kratos/secrets/jwks.public.json}
    issuer: ${AUTH_ISSUER:http://localhost:4433/}
    # Kratos identity id or email of the first admin (gets the admin role on every sign-in)
    initial-admin: ${AUTH_INITIAL_ADMIN:}
  kratos:
    # Kratos admin API for creating and managing accounts; only reachable inside the Docker network
    admin-url: ${KRATOS_ADMIN_URL:}
    # How long the setup code for a new account is valid
    setup-code-lifetime: ${KRATOS_SETUP_CODE_LIFETIME:24h}
  confirmations:
    # How long a confirmation (e.g. unlocking the door) waits for someone to decide
    lifetime: ${CONFIRMATION_LIFETIME:5m}
  trusted-devices:
    # Registering a phone for approvals needs a login at most this old (JWT claim auth_time)
    max-auth-age: ${TRUSTED_DEVICE_MAX_AUTH_AGE:15m}
    # How long a phone has to sign a challenge
    challenge-lifetime: ${TRUSTED_DEVICE_CHALLENGE_LIFETIME:60s}
  events:
    # Live updates (/api/events): ticket validity, maximum connection age, ping and recheck interval
    ticket-lifetime: ${EVENTS_TICKET_LIFETIME:30s}
    max-connection-age: ${EVENTS_MAX_CONNECTION_AGE:1h}
    heartbeat: ${EVENTS_HEARTBEAT:30s}
  mqtt:
    url: ${MQTT_URL:tcp://localhost:1883}
    username: ${MQTT_USER:}
    password: ${MQTT_PASSWORD:}
    client-id: smarthome-backend
    z2m-base-topic: zigbee2mqtt
    # How long to wait for Zigbee2MQTT to answer a bridge request (e.g. permit join)
    z2m-request-timeout: ${Z2M_REQUEST_TIMEOUT:5s}

springdoc:
  # Responses are JSON; without this the description says */*, which generated clients cannot type
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
